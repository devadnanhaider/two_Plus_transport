<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" fill="none">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Blue Arc & Road background -->
  <path d="M 30 145 C 80 80, 200 60, 280 90 L 260 110 C 190 85, 95 100, 50 145 Z" fill="url(#blueGrad)" />
  <path d="M 40 145 C 100 115, 230 110, 310 135 L 290 155 C 220 135, 110 135, 60 155 Z" fill="#0F172A" />
  
  <!-- Dashed Road Markings -->
  <path d="M 90 140 Q 150 132 210 140" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 8" opacity="0.9"/>

  <!-- 2+ Emblem -->
  <g transform="translate(90, 25)">
    <!-- '2' Symbol -->
    <path d="M 20 50 C 20 20, 70 15, 75 42 C 80 65, 30 75, 20 95 L 90 95 L 90 75 L 50 75 C 65 60, 95 50, 95 35 C 95 10, 45 0, 10 30 Z" fill="url(#blueGrad)"/>
    <!-- '+' Symbol -->
    <path d="M 102 38 L 122 38 L 122 20 L 138 20 L 138 38 L 158 38 L 158 54 L 138 54 L 138 72 L 122 72 L 122 54 L 102 54 Z" fill="url(#blueGrad)"/>
  </g>

  <!-- Truck Graphic -->
  <g transform="translate(260, 85)">
    <!-- Trailer Body -->
    <path d="M 10 15 L 110 15 L 125 45 L 125 60 L 10 60 Z" fill="#0066FF"/>
    <path d="M 15 20 L 105 20 L 105 55 L 15 55 Z" fill="#FFFFFF"/>
    <!-- Speed Lines on Trailer -->
    <line x1="20" y1="28" x2="95" y2="28" stroke="#0066FF" stroke-width="4"/>
    <line x1="25" y1="38" x2="95" y2="38" stroke="#0066FF" stroke-width="4"/>
    <line x1="30" y1="48" x2="95" y2="48" stroke="#0066FF" stroke-width="4"/>
    
    <!-- Truck Cabin -->
    <path d="M 126 18 L 160 22 C 170 28, 178 40, 178 52 L 178 60 L 126 60 Z" fill="#0F172A"/>
    <!-- Windshield -->
    <path d="M 145 26 L 165 30 C 170 35, 172 42, 172 45 L 145 45 Z" fill="#00A3FF"/>
    <!-- Headlight -->
    <rect x="170" y="52" width="8" height="5" rx="2" fill="#00A3FF"/>
    
    <!-- Wheels -->
    <circle cx="35" cy="62" r="10" fill="#0F172A"/>
    <circle cx="35" cy="62" r="5" fill="#FFFFFF"/>
    <circle cx="58" cy="62" r="10" fill="#0F172A"/>
    <circle cx="58" cy="62" r="5" fill="#FFFFFF"/>
    
    <circle cx="120" cy="62" r="10" fill="#0F172A"/>
    <circle cx="120" cy="62" r="5" fill="#FFFFFF"/>
    <circle cx="152" cy="62" r="10" fill="#0F172A"/>
    <circle cx="152" cy="62" r="5" fill="#FFFFFF"/>
  </g>

  <!-- TWO PLUS Text -->
  <text x="250" y="188" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="44" fill="#0F172A" letter-spacing="2">
    TWO PLUS
  </text>
  
  <!-- TRANSPORT Text with Lines -->
  <line x1="35" y1="205" x2="105" y2="205" stroke="#00A3FF" stroke-width="4" stroke-linecap="round"/>
  <text x="250" y="212" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="22" fill="#00A3FF" letter-spacing="8">
    TRANSPORT
  </text>
  <line x1="395" y1="205" x2="465" y2="205" stroke="#00A3FF" stroke-width="4" stroke-linecap="round"/>
</svg>
